<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precios y Ganancias | Emprendedores</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --azul-oscuro: #0f294a;
            --azul-medio: #1d4ed8;
            --azul-brillante: #2563eb;
            --amarillo-oro: #facc15;
            --amarillo-hover: #eab308;
            --amarillo-suave: #fef9c3;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul-medio) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator-card {
            background: #ffffff;
            border-radius: 24px;
            border: 4px solid var(--amarillo-oro);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            max-width: 580px;
            width: 100%;
            overflow: hidden;
        }

        .card-header-blue {
            background: var(--azul-oscuro);
            color: #ffffff;
            padding: 28px 24px;
            text-align: center;
            border-bottom: 5px solid var(--amarillo-oro);
        }

        .card-header-blue h1 {
            font-weight: 800;
            font-size: 1.75rem;
            color: var(--amarillo-oro);
            margin-bottom: 6px;
        }

        .form-label {
            color: var(--azul-oscuro);
            font-weight: 700;
            font-size: 0.95rem;
        }

        .input-group-text {
            background-color: var(--azul-oscuro);
            color: var(--amarillo-oro);
            border: 2px solid var(--azul-oscuro);
            font-weight: 700;
            border-radius: 12px 0 0 12px;
        }

        .form-control {
            border: 2px solid #cbd5e1;
            padding: 12px 15px;
            font-weight: 600;
            color: var(--azul-oscuro);
            border-radius: 0 12px 12px 0;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            border-color: var(--azul-brillante);
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.2);
        }

        .btn-yellow {
            background-color: var(--amarillo-oro);
            color: var(--azul-oscuro);
            font-weight: 800;
            font-size: 1.1rem;
            padding: 14px;
            border-radius: 14px;
            border: none;
            box-shadow: 0 6px 15px rgba(250, 204, 21, 0.4);
            transition: all 0.2s ease;
        }

        .btn-yellow:hover {
            background-color: var(--amarillo-hover);
            color: var(--azul-oscuro);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(250, 204, 21, 0.5);
        }

        .btn-outline-blue {
            border: 2px solid var(--azul-oscuro);
            color: var(--azul-oscuro);
            font-weight: 600;
            border-radius: 14px;
            padding: 12px;
            transition: all 0.2s ease;
        }

        .btn-outline-blue:hover {
            background-color: var(--azul-oscuro);
            color: var(--amarillo-oro);
        }

        .results-panel {
            background: var(--amarillo-suave);
            border: 2px dashed var(--azul-oscuro);
            border-radius: 18px;
            padding: 22px;
            display: none;
        }

        .metric-box {
            background: #ffffff;
            border-radius: 14px;
            padding: 16px;
            border-left: 6px solid var(--azul-brillante);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .metric-box.highlight {
            background: var(--azul-oscuro);
            color: #ffffff;
            border-left: 6px solid var(--amarillo-oro);
        }

        .metric-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            opacity: 0.85;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 4px 0 0 0;
        }

        .highlight .metric-value {
            color: var(--amarillo-oro);
        }

        .quick-chips button {
            background-color: #eff6ff;
            color: var(--azul-medio);
            border: 1px solid #bfdbfe;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            transition: all 0.2s;
        }

        .quick-chips button:hover {
            background-color: var(--azul-medio);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="calculator-card animate__animated animate__zoomIn">
        <!-- Encabezado -->
        <div class="card-header-blue">
            <h1><i class="bi bi-calculator-fill"></i> Calculadora de Precios</h1>
            <p class="mb-0 text-light opacity-90">Define tu precio de venta y asegura tu margen de ganancia 💰</p>
        </div>

        <!-- Formulario -->
        <div class="card-body p-4 p-md-5">
            <form id="formCalculadora" novalidate>
                <!-- Costo Base -->
                <div class="mb-4">
                    <label for="costoBase" class="form-label">
                        📦 Costo base del producto
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" id="costoBase" class="form-control" placeholder="Ej. 150.00" min="0.01" step="0.01" required>
                    </div>
                    <div class="invalid-feedback d-block d-none text-danger fw-semibold mt-1" id="errorCosto">
                        ⚠️ Ingresa un costo mayor a $0.
                    </div>
                </div>

                <!-- Porcentaje de Ganancia -->
                <div class="mb-3">
                    <label for="porcentajeGanancia" class="form-label">
                        📈 Porcentaje de ganancia deseado
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">%</span>
                        <input type="number" id="porcentajeGanancia" class="form-control" placeholder="Ej. 40" min="1" step="0.1" required>
                    </div>
                    <div class="invalid-feedback d-block d-none text-danger fw-semibold mt-1" id="errorPorcentaje">
                        ⚠️ Ingresa un porcentaje válido (mayor a 0%).
                    </div>
                </div>

                <!-- Atajos rápidos de porcentaje -->
                <div class="quick-chips d-flex flex-wrap gap-2 mb-4">
                    <span class="small text-muted align-self-center me-1">Sugeridos:</span>
                    <button type="button" onclick="setPorcentaje(20)">+20%</button>
                    <button type="button" onclick="setPorcentaje(30)">+30%</button>
                    <button type="button" onclick="setPorcentaje(50)">+50%</button>
                    <button type="button" onclick="setPorcentaje(100)">+100% (Doble)</button>
                </div>

                <!-- Botones de acción -->
                <div class="row g-2 mb-4">
                    <div class="col-8">
                        <button type="submit" class="btn btn-yellow w-100">
                            <i class="bi bi-lightning-charge-fill"></i> Calcular Precio
                        </button>
                    </div>
                    <div class="col-4">
                        <button type="button" id="btnLimpiar" class="btn btn-outline-blue w-100">
                            <i class="bi bi-arrow-counterclockwise"></i> Limpiar
                        </button>
                    </div>
                </div>
            </form>

            <!-- Panel de Resultados -->
            <div id="panelResultados" class="results-panel">
                <div class="row g-3">
                    <!-- Precio Final Sugerido -->
                    <div class="col-12">
                        <div class="metric-box highlight text-center">
                            <div class="metric-title">🏷️ Precio Final Sugerido al Público</div>
                            <p id="precioFinalTexto" class="metric-value">$0.00</p>
                        </div>
                    </div>

                    <!-- Ganancia Neta -->
                    <div class="col-sm-6">
                        <div class="metric-box text-center">
                            <div class="metric-title text-primary">💵 Ganancia Neta</div>
                            <p id="gananciaNetaTexto" class="metric-value text-dark fs-4">$0.00</p>
                        </div>
                    </div>

                    <!-- Margen sobre venta -->
                    <div class="col-sm-6">
                        <div class="metric-box text-center">
                            <div class="metric-title text-primary">📊 Margen Real</div>
                            <p id="margenRealTexto" class="metric-value text-dark fs-4">0%</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica JavaScript -->
    <script>
        const form = document.getElementById('formCalculadora');
        const inputCosto = document.getElementById('costoBase');
        const inputPorcentaje = document.getElementById('porcentajeGanancia');
        const panelResultados = document.getElementById('panelResultados');
        const btnLimpiar = document.getElementById('btnLimpiar');

        const precioFinalTexto = document.getElementById('precioFinalTexto');
        const gananciaNetaTexto = document.getElementById('gananciaNetaTexto');
        const margenRealTexto = document.getElementById('margenRealTexto');

        const errorCosto = document.getElementById('errorCosto');
        const errorPorcentaje = document.getElementById('errorPorcentaje');

        // Formateador de moneda
        const formatoMoneda = new Intl.NumberFormat('es-MX', {
            style: 'currency',
            currency: 'MXN',
            minimumFractionDigits: 2
        });

        // Función para los botones rápidos de porcentaje
        function setPorcentaje(valor) {
            inputPorcentaje.value = valor;
            errorPorcentaje.classList.add('d-none');
            if (inputCosto.value > 0) {
                calcularPrecios();
            }
        }

        // Evento al enviar el formulario
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            calcularPrecios();
        });

        function calcularPrecios() {
            const costo = parseFloat(inputCosto.value);
            const porcentaje = parseFloat(inputPorcentaje.value);
            let valido = true;

            // Validaciones
            if (isNaN(costo) || costo <= 0) {
                errorCosto.classList.remove('d-none');
                valido = false;
            } else {
                errorCosto.classList.add('d-none');
            }

            if (isNaN(porcentaje) || porcentaje <= 0) {
                errorPorcentaje.classList.remove('d-none');
                valido = false;
            } else {
                errorPorcentaje.classList.add('d-none');
            }

            if (!valido) return;

            // Cálculos financieros
            const gananciaNeta = costo * (porcentaje / 100);
            const precioFinal = costo + gananciaNeta;
            const margenSobreVenta = (gananciaNeta / precioFinal) * 100;

            // Mostrar valores en pantalla
            precioFinalTexto.textContent = formatoMoneda.format(precioFinal);
            gananciaNetaTexto.textContent = formatoMoneda.format(gananciaNeta);
            margenRealTexto.textContent = margenSobreVenta.toFixed(1) + '%';

            // Mostrar panel con animación
            panelResultados.style.display = 'block';
            panelResultados.classList.remove('animate__animated', 'animate__fadeInUp');
            void panelResultados.offsetWidth; // Reiniciar animación
            panelResultados.classList.add('animate__animated', 'animate__fadeInUp');
        }

        // Botón limpiar
        btnLimpiar.addEventListener('click', () => {
            form.reset();
            panelResultados.style.display = 'none';
            errorCosto.classList.add('d-none');
            errorPorcentaje.classList.add('d-none');
            inputCosto.focus();
        });
    </script>
</body>
</html>
